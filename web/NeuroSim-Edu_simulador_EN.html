<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroSim-Edu · Simulator</title>
<script>
/* Integration v2: web fonts only when the browser reports a connection; offline (double-click without network) the
   system fonts are used directly and no failed request is logged. Canvases are redrawn once the fonts arrive. */
if(navigator.onLine!==false){const l=document.createElement("link");l.rel="stylesheet";
  l.href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap";
  l.onload=()=>{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(typeof grafRedraw==="function")grafRedraw()})};
  document.head.appendChild(l)}
</script>
<style>
/* Layout: lab-bench console — controls column on the left, oscilloscope-style traces on the right; tabs = modules */
:root{
  --bg:#f6f7fb; --panel:#ffffff; --fg:#1d2033; --muted:#5b6078; --line:#dde0ec;
  --accent:#332288; --wine:#882255; --teal:#2f8f80; --rose:#b8505f; --olive:#7d7d22; --purple:#8a3f8a; --grid:#eceef5; --lts:#2b8fd0;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131c; --panel:#1b1d29; --fg:#e8e9f2; --muted:#a3a7bd; --line:#2f3245;
  --accent:#9d8cff; --wine:#e07aa8; --teal:#5fd0bd; --rose:#f08a97; --olive:#d6d36a; --purple:#d08ad0; --grid:#252838; --lts:#88ccee; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131c; --panel:#1b1d29; --fg:#e8e9f2; --muted:#a3a7bd; --line:#2f3245;
  --accent:#9d8cff; --wine:#e07aa8; --teal:#5fd0bd; --rose:#f08a97; --olive:#d6d36a; --purple:#d08ad0; --grid:#252838; --lts:#88ccee; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:1.8rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.95rem;color:var(--muted);letter-spacing:0}
.lang{display:flex;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--panel)}
.lang button{border:0;background:none;color:var(--muted);font:500 .85rem var(--f-body);padding:4px 10px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 .9rem var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer}
nav button .n{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
nav button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mod{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.mod{grid-template-columns:minmax(0,1fr)}}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.ctl h2{font-family:var(--f-display);font-size:1.1rem;margin:0}
.ctl p.lead{margin:0;color:var(--muted);font-size:.9rem}
.row{display:grid;gap:4px}
.row label{display:flex;justify-content:space-between;font-size:.88rem;gap:8px}
.row output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button,.run{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 .82rem var(--f-body);padding:6px 10px;border-radius:6px;cursor:pointer}
.run{background:var(--accent);color:var(--panel);border-color:var(--accent);font-size:.9rem;padding:8px 12px}
.out{display:grid;gap:12px;min-width:0}
.plot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 4px}
.plot .cap{font-size:.82rem;color:var(--muted);padding:0 6px 4px}
canvas{width:100%;display:block}
[hidden]{display:none!important}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.note{background:var(--panel);border-left:3px solid var(--wine);border-radius:0 8px 8px 0;padding:10px 14px;font-size:.9rem;max-width:75ch}
.label-sm{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
footer{color:var(--muted);font-size:.82rem;max-width:80ch}
/* UX: header tools, active presets, reset, stale state ------------------------------------------- */
.uxbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.uxbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 .84rem var(--f-body);padding:5px 10px;border-radius:8px;cursor:pointer}
.uxbtn:hover,.presets button:hover{border-color:var(--accent)}
.ctl .uxbtn{justify-self:start;background:var(--bg)}
.presets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.run.stale{outline:2px dashed var(--wine);outline-offset:2px}
.stalemsg{margin:0;font-size:.82rem;color:var(--wine)}
.run:disabled{opacity:.7;cursor:progress}
/* UX: first-visit onboarding */
.onb{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 16px;display:grid;gap:8px;max-width:90ch}
.onb h2{font-family:var(--f-display);font-size:1rem;margin:0}
.onb ol{margin:0;padding-left:1.3em;display:grid;gap:2px}
.onb p{margin:0;color:var(--muted);font-size:.88rem}
.onb .uxbar .uxbtn:first-child{background:var(--accent);color:var(--panel);border-color:var(--accent)}
/* UX: guide panel (what to observe, challenges, clinical cases) */
details.guide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.guide>summary{font-family:var(--f-display);font-weight:500;cursor:pointer}
.gbody h3{font-family:var(--f-display);font-size:.95rem;margin:14px 0 6px}
.gbody ul,.gbody ol{margin:0;padding-left:1.3em;display:grid;gap:10px;max-width:78ch;font-size:.92rem}
.gbody .reto p{margin:0 0 6px}
.gbody details summary{cursor:pointer;color:var(--accent);font-size:.86rem;margin-top:4px}
.gbody details>div,.gbody details>p{margin:6px 0 0;padding:8px 10px;background:var(--bg);border-radius:6px;font-size:.9rem}
.cases{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.case{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;align-content:start;font-size:.9rem}
.case h4{margin:0;font-size:.93rem}
.case p{margin:0}
.case .vig{font-style:italic}
.case p.lim{border-left:3px solid var(--olive);color:var(--muted)}
/* UX: glossary dialog */
dialog#gl{width:min(680px,calc(100vw - 32px));max-height:85vh;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:16px 20px}
dialog#gl::backdrop{background:rgba(10,10,20,.45)}
#gl h2{font-family:var(--f-display);font-size:1.15rem;margin:0 0 10px}
#gl dl{margin:0}
#gl dt{font-weight:600;margin-top:10px}
#gl dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
#gl .uxbtn{position:sticky;top:0;float:right}
/* UX: phones — keep the main trace in view while moving sliders (first plot goes on top and sticks) */
@media screen and (max-width:820px){
  .mod>.out{display:contents}
  .mod>.out>.plot:first-child{order:-1;position:sticky;top:0;z-index:3;box-shadow:0 6px 12px -6px rgba(0,0,0,.25)}
}
/* UX: worksheet + print */
#ws{display:none}
@media print{
  :root,:root[data-theme]{--bg:#fff;--panel:#fff;--fg:#000;--muted:#333;--line:#bbb}
  body{padding:0;font-size:11pt}
  nav,.lang,.uxbar,.presets,.run,.ctl .uxbtn,.onb,details.guide,.stalemsg{display:none!important}
  .mod{grid-template-columns:minmax(0,1fr)}
  canvas{height:auto!important}
  .plot,.stats,.note{break-inside:avoid}
  body.ws-print .wrap{display:none}
  body.ws-print #ws{display:block}
  #ws h1{font-family:var(--f-display);font-size:16pt;margin:0 0 4px}
  #ws h2{font-family:var(--f-display);font-size:13pt;margin:16px 0 6px;break-after:avoid}
  #ws .wsq{break-inside:avoid;margin:0 0 10px}
  #ws .wsq p{margin:0 0 4px}
  #ws .ln{border-bottom:1px solid #999;min-height:1.9em;font-size:9pt;color:#555;padding-top:2px}
  #ws .key{break-before:page}
  #ws .key p{margin:0 0 6px;font-size:10pt}
}
/* GRAF: plot tokens — Tol "muted" families of the article figures, re-stepped and validated
   (dataviz validate_palette.js, all-pairs) against #ffffff (light) and #1b1d29 (dark).
   --s1 wine / --s2 indigo / --s3 teal = series slots; --exc/--inh = raster populations; --stim = stimulus bar (paper sand). */
:root{--s1:#9b2a62;--s2:#4b3bb5;--s3:#0f9a87;--exc:#0f9a87;--inh:#c2455a;--stim:#d9c66a;--ghost:#9aa0b8;--axis:#8a8fa6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#e070a5;--s2:#8a78f5;--s3:#0c8a78;--exc:#14a893;--inh:#e0606f;--stim:#8f8440;--ghost:#666b88;--axis:#555a73}}
:root[data-theme="dark"]{--s1:#e070a5;--s2:#8a78f5;--s3:#0c8a78;--exc:#14a893;--inh:#e0606f;--stim:#8f8440;--ghost:#666b88;--axis:#555a73}
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:4px 8px;padding:0 0 2px}
.phead .cap{flex:1 1 240px;min-width:0}
.ptools{display:flex;gap:4px;flex-shrink:0}
.ptools button{border:1px solid var(--line);background:var(--bg);color:var(--muted);font:500 .74rem var(--f-body);padding:3px 8px;border-radius:6px;cursor:pointer;line-height:1.3}
.ptools button:hover{color:var(--fg)}
.ptools button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.pbox{position:relative;touch-action:pan-y}
.pbox canvas.ov{position:absolute;left:0;top:0;pointer-events:none}
.pbox canvas.main{cursor:crosshair}
.ptip{position:absolute;top:4px;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);padding:4px 8px;font:12px/1.45 var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap;z-index:2}
.ptip .sw{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.ptip b{font-weight:600}
@media (forced-colors:active){.ptools button[aria-pressed="true"]{outline:2px solid CanvasText}}
/* GRAF: end */
/* DATOS: estilos para las pestañas nuevas (protocolos HH, clasificador) */
.run[disabled]{opacity:.6;cursor:progress}
.qual{display:inline-block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--wine);border:1px solid var(--wine);border-radius:4px;padding:0 5px;margin-left:4px}
.cmwrap{display:flex;flex-wrap:wrap;gap:12px}
.cm{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;max-width:100%}
.cm table{border-collapse:collapse;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.cm th,.cm td{padding:3px 6px;text-align:center;border:1px solid var(--line)}
.cm th{font-weight:500;color:var(--muted)}
.cm caption{font-size:.82rem;color:var(--muted);text-align:left;padding-bottom:4px;font-family:var(--f-body)}
.bench{border-collapse:collapse;font-size:.85rem;width:100%}
.bench th,.bench td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums}
.bench th:first-child,.bench td:first-child{text-align:left}
#pro-tab,#cls-cm{min-width:0}
/* DATOS: fin estilos */
/* Integration v2: print + small fixes for the merged features */
@media print{.ptools,.ptip,.pbox canvas.ov,#pro-run,.stalemsg{display:none!important}}
.cmwrap .cm{flex:1 1 260px}
@media (max-width:420px){nav button{padding:7px 11px;font-size:.86rem}}
/* Integration v2: end */
/* UX: end */
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>NeuroSim-Edu <small data-i="subtitle"></small></h1>
  <!-- UX: header tools (glossary, worksheet, theme) next to the language switch -->
  <div class="uxbar">
    <button class="uxbtn" id="ux-gl-btn" data-i="ux_gloss"></button>
    <button class="uxbtn" id="ux-ws-btn" data-i="ux_print"></button>
    <button class="uxbtn" id="ux-theme-btn" data-i="ux_theme"></button>
    
  </div>
</header>
<!-- UX: first-visit onboarding (dismissed state kept in localStorage "nse-onb") -->
<section class="onb" id="ux-onb" hidden aria-labelledby="ux-onb-t">
  <h2 id="ux-onb-t" data-i="ux_on_t"></h2>
  <ol><li data-i="ux_on_1"></li><li data-i="ux_on_2"></li><li data-i="ux_on_3"></li></ol>
  <p data-i="ux_on_note"></p>
  <div class="uxbar"><button class="uxbtn" id="ux-onb-ok" data-i="ux_on_ok"></button><button class="uxbtn" id="ux-onb-gl" data-i="ux_gloss"></button></div>
</section>
<nav role="tablist" id="tabs"></nav>

<!-- 1 Hodgkin-Huxley + clinical scenarios -->
<section class="mod" id="m-hh" role="tabpanel" aria-labelledby="tab-0">
  <div class="ctl">
    <h2 data-i="hh_t"></h2><p class="lead" data-i="hh_l"></p>
    <div class="row"><label for="hh-I"><span data-i="I_ua"></span><output id="hh-I-o"></output></label><input id="hh-I" type="range" min="0" max="30" step="0.25" value="10"></div>
    <div class="row"><label for="hh-dur"><span data-i="pulse"></span><output id="hh-dur-o"></output></label><input id="hh-dur" type="range" min="1" max="140" step="1" value="100"></div>
    <div class="row"><label for="hh-na"><span data-i="nablock"></span><output id="hh-na-o"></output></label><input id="hh-na" type="range" min="0" max="100" step="5" value="0"></div>
    <div class="row"><label for="hh-k"><span data-i="kblock"></span><output id="hh-k-o"></output></label><input id="hh-k" type="range" min="0" max="60" step="5" value="0"></div>
    <div class="row"><label for="hh-ko"><span data-i="kout"></span><output id="hh-ko-o"></output></label><input id="hh-ko" type="range" min="2" max="14" step="0.5" value="4"></div>
    <!-- DATOS: temperatura (Q10) y calcio extracelular (desplazamiento de las compuertas) -->
    <div class="row"><label for="hh-T"><span data-i="temp"></span><output id="hh-T-o"></output></label><input id="hh-T" type="range" min="6.3" max="30" step="0.1" value="6.3"></div>
    <div class="row"><label for="hh-ca"><span data-i="caout"></span><output id="hh-ca-o"></output></label><input id="hh-ca" type="range" min="0.3" max="3" step="0.05" value="1"></div>
    <div><div class="label-sm" data-i="scen"></div>
      <div class="presets" id="hh-presets"></div></div>
    <button class="uxbtn" data-reset="0" data-i="ux_reset"></button>
  </div>
  <div class="out">
    <div class="plot"><div class="cap" data-i="hh_c1"></div><canvas id="hh-v" height="260" data-ghost="1"></canvas></div>
    <div class="plot"><div class="cap" data-i="hh_c2"></div><canvas id="hh-g" height="170"></canvas></div>
    <div class="stats" id="hh-s"></div>
    <div class="note" id="hh-note" aria-live="polite"></div>
    <details class="guide" open><summary data-i="ux_guide"></summary><div class="gbody" id="gb-hh"></div></details>
  </div>
</section>

<!-- 2 LIF -->
<section class="mod" id="m-lif" role="tabpanel" aria-labelledby="tab-1" hidden>
  <div class="ctl">
    <h2 data-i="lif_t"></h2><p class="lead" data-i="lif_l"></p>
    <div class="row"><label for="lif-I"><span data-i="I_na"></span><output id="lif-I-o"></output></label><input id="lif-I" type="range" min="0" max="5" step="0.1" value="2"></div>
    <div class="row"><label for="lif-dt"><span>Δt (ms)</span></label>
      <select id="lif-dt"><option value="0.01">0.01</option><option value="0.1" selected>0.1</option><option value="0.5">0.5</option><option value="1">1</option></select></div>
    <button class="uxbtn" data-reset="1" data-i="ux_reset"></button>
  </div>
  <div class="out">
    <div class="plot"><div class="cap" data-i="lif_c1"></div><canvas id="lif-v" height="240" data-ghost="1"></canvas></div>
    <div class="plot"><div class="cap" data-i="lif_c2"></div><canvas id="lif-f" height="220"></canvas></div>
    <div class="stats" id="lif-s"></div>
    <div class="note" id="lif-note" aria-live="polite"></div>
    <details class="guide" open><summary data-i="ux_guide"></summary><div class="gbody" id="gb-lif"></div></details>
  </div>
</section>

<!-- 3 Izhikevich -->
<section class="mod" id="m-izh" role="tabpanel" aria-labelledby="tab-2" hidden>
  <div class="ctl">
    <h2 data-i="izh_t"></h2><p class="lead" data-i="izh_l"></p>
    <div class="row"><label for="izh-cls" data-i="cls"></label><select id="izh-cls"></select></div>
    <div class="row"><label for="izh-a"><span data-i="izh_a"></span><output id="izh-a-o"></output></label><input id="izh-a" type="range" min="0.01" max="0.12" step="0.005" value="0.02"></div>
    <div class="row"><label for="izh-b"><span data-i="izh_b"></span><output id="izh-b-o"></output></label><input id="izh-b" type="range" min="0.15" max="0.3" step="0.005" value="0.2"></div>
    <div class="row"><label for="izh-c"><span data-i="izh_c"></span><output id="izh-c-o"></output></label><input id="izh-c" type="range" min="-70" max="-45" step="1" value="-65"></div>
    <div class="row"><label for="izh-d"><span data-i="izh_d"></span><output id="izh-d-o"></output></label><input id="izh-d" type="range" min="0" max="10" step="0.5" value="8"></div>
    <div class="row"><label for="izh-I"><span data-i="I_dim"></span><output id="izh-I-o"></output></label><input id="izh-I" type="range" min="0" max="20" step="0.5" value="10"></div>
    <button class="uxbtn" data-reset="2" data-i="ux_reset"></button>
  </div>
  <div class="out">
    <div class="plot"><div class="cap" data-i="izh_c1"></div><canvas id="izh-v" height="260" data-ghost="1"></canvas></div>
    <div class="stats" id="izh-s"></div>
    <div class="note" id="izh-note" aria-live="polite"></div>
    <details class="guide" open><summary data-i="ux_guide"></summary><div class="gbody" id="gb-izh"></div></details>
  </div>
</section>

<!-- 4 Network -->
<section class="mod" id="m-net" role="tabpanel" aria-labelledby="tab-3" hidden>
  <div class="ctl">
    <h2 data-i="net_t"></h2><p class="lead" data-i="net_l"></p>
    <div class="row"><label for="net-g"><span data-i="g"></span><output id="net-g-o"></output></label><input id="net-g" type="range" min="1" max="8" step="0.5" value="6"></div>
    <div class="row"><label for="net-ext"><span data-i="ext"></span><output id="net-ext-o"></output></label><input id="net-ext" type="range" min="5" max="12" step="0.5" value="7"></div>
    <div class="row"><label for="net-ni"><span data-i="ninh"></span><output id="net-ni-o"></output></label><input id="net-ni" type="range" min="50" max="200" step="25" value="200"></div>
    <div class="row"><label for="net-th"><span data-i="nth"></span><output id="net-th-o"></output></label><input id="net-th" type="range" min="-50" max="-46" step="0.5" value="-50"></div>
    <div class="presets" id="net-presets"></div>
    <button class="run" id="net-run" data-i="run"></button>
    <p class="stalemsg" id="net-stale" data-i="ux_stale" hidden></p>
    <button class="uxbtn" data-reset="3" data-i="ux_reset"></button>
  </div>
  <div class="out">
    <div class="plot"><div class="cap" data-i="net_c1"></div><canvas id="net-r" height="280"></canvas></div>
    <div class="plot"><div class="cap" data-i="net_c2"></div><canvas id="net-p" height="160" data-ghost="1"></canvas></div>

 r_lif2_a:"About 34 Hz at 1.6 nA, tending to 0 as I approaches 1.5 nA: the f-I curve is continuous (type I). In Hodgkin-Huxley the rate jumps from 0 to about 50 Hz (type II).",
 r_lif3_q:"Numerical error. With I = 5 nA try Δt = 0.01, 0.1, 0.5 and 1 ms and note the “Error” chip. How does it change? Repeat with I = 2 nA.",
 r_lif3_a:"At 5 nA: about 0.10, 1.08, 2.18 and 12.97 Hz; error grows with Δt. At 2 nA it is 0.01, 0.25, 0.54 and 0.54 Hz: for a single current the error jumps because each interval is rounded to a whole number of steps (with Δt = 0.5 and 1 ms the interval is the same, 16 ms). Look at the f-I curve: the maximum error over all currents is 0.10, 1.59, 8.26 and 12.97 Hz and, on average, it grows in proportion to Δt (Euler is first order, as in the article). Halving Δt halves the error but doubles the computation.",
 r_lif4_q:"Maximum rate. What limit does the 2 ms refractory period impose? What is the rate at 5 nA?",
 r_lif4_a:"It can never exceed 1/(2 ms) = 500 Hz. At 5 nA it fires at about 179 Hz (5.6 ms interval: 2 ms refractory and about 3.6 ms of integration). The integration time still outweighs the refractory period.",

 r_izh2_q:"Adaptation. In RS count the spikes with d = 8 and then with d = 2. What does d represent?",

 c_hyk_t:"Hyperkalaemia in chronic kidney disease",
 c_hyk_v:"A 68-year-old man with chronic kidney disease, muscle weakness and a serum K⁺ of 7.5 mM.",
 c_hyk_q:"At K⁺ 7.5 mM, is the cell more or less excitable than the control? Raise it to 12 mM: what changes and why?",

 c_hyk_l:"The model still fires at 7.5 mM and falls silent only from 8.5 mM, whereas the patient is already weak: squid parameters, fixed leak, no myelin or neuromuscular junction. Model concentrations are not clinical thresholds. Intravenous calcium, which stabilises the cardiac membrane, is not in the model: discuss it, do not simulate it.",

 c_lido_l:"The model reduces Na⁺ conductance uniformly; lidocaine binds mainly to open or inactivated channels (use-dependent block), which is not represented: that is why in the model it does not lengthen the refractory period (check it with the paired pulses of tab 5). An isopotential patch also cannot show conduction along the axon.",

 c_hypok_i:"E_K falls to about −89.5 mV and rest to about −68 mV: the cell hyperpolarises and at I = 8 gives a single spike (7 in the control). Less excitability, consistent with weakness.",

 c_drav_v:"An 8-month-old infant with prolonged fever-triggered seizures; genetic testing shows a loss-of-function variant in SCN1A.",

 c_drav_l:"Here this is simulated by removing interneurons, not by reducing their Na⁺ current; the network has no fever, thermoregulation or cortical geometry. Hypersynchrony is a computational picture, not an EEG.",
 /* UX: glossary [term, definition] */
 gloss:[["Model","A set of rules a computer follows to imitate a cell. This one uses squid-axon parameters: use it to reason about mechanisms; it gives no clinical thresholds or doses."],
  ["Membrane potential","Voltage difference between the inside and the outside of the cell, in mV. At rest it is negative (about −65 mV in the model)."],
  ["Action potential (spike)","A fast rise and fall of voltage (about 2 ms) that carries the signal. “Firing” means producing action potentials."],
  ["Threshold","The voltage or current from which a spike is produced."],
  ["Rheobase","The smallest constant current that, held long enough, eventually produces spikes. It underlies the strength-duration curves of nerve excitability testing and neurostimulator programming."],
  ["Gates m, h and n","Parts of the channels that open or close with voltage (fraction from 0 to 1). m opens the Na⁺ channel fast; h closes it more slowly (inactivation); n opens the K⁺ channel."],
  ["Na⁺ inactivation","Closure of the Na⁺ channel by gate h while the membrane stays depolarised. It prevents immediate re-firing (refractory period)."],
  ["Depolarisation block","Silence of a cell that is kept depolarised, because its Na⁺ channels remain inactivated (for example, in severe hyperkalaemia)."],
  ["E_K (Nernst equation)","The voltage at which K⁺ stops flowing: E_K = −77 + 26.7·ln([K⁺]ₒ/4) mV. If extracellular K⁺ rises, E_K becomes less negative and the cell depolarises."],

const LIF={tau:10,EL:-65,Vth:-50,Vr:-65,R:10,tref:2};
/* DATOS: fix. The spike is dated at t[i+1] and the cell is held at V_reset while t[i] < t_spike + t_ref (as point.simulate_lif). */
function lifRun(I,dur,dt){const N=Math.round(dur/dt),t=new Array(N),Vs=new Array(N),sp=[];let hold=-1;
  Vs[0]=LIF.EL;for(let i=0;i<N;i++)t[i]=i*dt;
  for(let i=0;i<N-1;i++){if(t[i]<hold){Vs[i+1]=LIF.Vr;continue}
    const Vi=Vs[i]>=LIF.Vth?LIF.Vr:Vs[i];            // the spike sample is drawn at +20 mV
    let Vn=Vi+dt*(-(Vi-LIF.EL)+LIF.R*I)/LIF.tau;
    if(Vn>=LIF.Vth){sp.push(t[i+1]);Vn=20;hold=t[i+1]+LIF.tref}
    Vs[i+1]=Vn}
  return{t,V:Vs,sp}}
const lifExact=I=>{const d=LIF.R*I-(LIF.Vth-LIF.EL);return d<=0?0:1000/(LIF.tref+LIF.tau*Math.log(LIF.R*I/d))};

// ---------------------------------------------------------------- network
function rngf(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function poisson(lam,r){let L=Math.exp(-lam),k=0,p=1;do{k++;p*=r()}while(p>L);return k-1}
/* DATOS: configurable threshold (params={"V_th":vth} in Python) */
function netRun(g,ext,nI,seed=0,vth=LIF.Vth){const nE=800,n=nE+nI,J=0.2,dt=0.1,dur=400,r=rngf(seed+1);
  const out=[];for(let i=0;i<n;i++){const l=[];for(let j=0;j<n;j++)if(j!==i&&r()<0.1)l.push(j);out.push(l)} // pre -> list of post
  const V=new Float64Array(n).map(()=>LIF.Vr+r()*(vth-LIF.Vr)),ready=new Float64Array(n),inp=new Float64Array(n);
  let spk=[];const times=[],ids=[];
  for(let s=0;s<dur/dt;s++){const now=s*dt;inp.fill(0);
    for(const j of spk){const w=j<nE?J:-g*J;for(const k of out[j])inp[k]+=w}
    const nx=[];for(let i=0;i<n;i++){if(now>=ready[i]){V[i]+=dt*(LIF.EL-V[i])/LIF.tau+inp[i]+J*poisson(ext*dt,r);
      if(V[i]>=vth){nx.push(i);times.push(now);ids.push(i);V[i]=LIF.Vr;ready[i]=now+LIF.tref}}else V[i]=LIF.Vr}
    spk=nx}
  return{times,ids,n,nE,dur,vth}}
function netStats(net){const t0=100,T=(net.dur-t0)/1000;let cnt=0;const per=new Map();const bins=new Float64Array(net.dur-t0);
  for(let i=0;i<net.times.length;i++){const t=net.times[i];if(t<t0)continue;cnt++;bins[Math.min(bins.length-1,Math.floor(t-t0))]++;
    const id=net.ids[i];if(id%5===0){if(!per.has(id))per.set(id,[]);per.get(id).push(t)}}
  /* DATOS: population SD/variance (ddof = 0) as numpy .std()/.var() */
  const cvs=[];for(const s of per.values()){if(s.length>3){const d=s.slice(1).map((x,i)=>x-s[i]);const m=d.reduce((a,b)=>a+b)/d.length;const sd=Math.sqrt(d.reduce((a,b)=>a+(b-m)**2,0)/d.length);cvs.push(sd/m)}}
  const mb=bins.reduce((a,b)=>a+b)/bins.length,vb=bins.reduce((a,b)=>a+(b-mb)**2,0)/bins.length;
  return{rate:cnt/net.n/T,cv:cvs.length?cvs.reduce((a,b)=>a+b)/cvs.length:NaN,sync:mb>0?vb/mb:NaN}}

function vClamp(p,Vc,dur=14,t1=1,t2=11){const dt=0.01,N=Math.round(dur/dt);let V=-65,[am,bm,ah,bh,an,bn]=rates(V,p);
  let m=am/(am+bm),h=ah/(ah+bh),n=an/(an+bn),cur=NaN,mi,hi,ni,em,eh,en;const t=[],INa=[],IK=[];let pk=0,ikEnd=0;
  for(let i=0;i<N;i++){const tt=i*dt;V=(tt>=t1&&tt<t2)?Vc:-65;
    if(V!==cur){cur=V;[am,bm,ah,bh,an,bn]=rates(V,p);mi=am/(am+bm);hi=ah/(ah+bh);ni=an/(an+bn);em=Math.exp(-dt*(am+bm));eh=Math.exp(-dt*(ah+bh));en=Math.exp(-dt*(an+bn))}

const CLS=["RS","IB","CH","FS","LTS"];
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
// make_dataset de classifier.py: a, b, d × (1 + jitter·N), c + 2·N, escalón U(6, 14) desde 20 ms, ruido blanco σ/√Δt, Δt = 0,25 ms, 500 ms
function izhTrains(key,n,jit,noise,r){const [a0,b0,c0,d0]=IZH[key],dt=0.25,N=2000,ns=noise/Math.sqrt(dt),out=[];
  for(let k=0;k<n;k++){const a=a0*(1+jit*gauss(r)),b=b0*(1+jit*gauss(r)),c=c0+2*gauss(r),d=d0*(1+jit*gauss(r)),amp=6+8*r();
    let v=-65,u=b*v;const sp=[];
    for(let i=0;i<N;i++){const t=i*dt;const I=(t>=20?amp:0)+(noise?ns*gauss(r):0);
      if(v>=30){sp.push(t);v=c;u+=d}
      const dv=0.04*v*v+5*v+140-u+I,du=a*(b*v-u);v+=dt*dv;u+=dt*du}
    out.push(sp)}return out}
// spike_train_features de classifier.py
function trainFeatures(sp,onset=20,dur=500){const s=sp.filter(x=>x>=onset),rate=s.length/((dur-onset)/1000);let cv=0,ad=0,bu=0;
  if(s.length>=3){const isi=s.slice(1).map((x,i)=>x-s[i]),m=isi.reduce((a,b)=>a+b)/isi.length;
    cv=Math.sqrt(isi.reduce((a,b)=>a+(b-m)**2,0)/isi.length)/m;ad=(isi[isi.length-1]-isi[0])/(isi[isi.length-1]+isi[0]);bu=isi.filter(x=>x<10).length/isi.length}
  const lat=s.length?s[0]-onset:dur-onset;return[Math.log10(1+rate),cv,ad,bu,Math.min(lat,100)]}
// SpikeClassNet: ReLU + softmax, descenso por minilotes con momento y L2, inicialización de He; hidden = [] es regresión logística
function makeNet(nin,nout,hidden,r){const sz=[nin,...hidden,nout],W=[],b=[],vW=[],vb=[];
  for(let k=0;k<sz.length-1;k++){const i=sz[k],o=sz[k+1],w=new Float64Array(i*o);for(let j=0;j<w.length;j++)w[j]=gauss(r)*Math.sqrt(2/i);
    W.push(w);b.push(new Float64Array(o));vW.push(new Float64Array(i*o));vb.push(new Float64Array(o))}
  return{sz,W,b,vW,vb,nparams:W.reduce((a,w,k)=>a+w.length+b[k].length,0)}}
function fwd(net,x){const acts=[x];for(let k=0;k<net.W.length;k++){const i=net.sz[k],o=net.sz[k+1],a=acts[k],W=net.W[k],z=new Float64Array(o);
    for(let q=0;q<o;q++){let s=net.b[k][q];for(let p=0;p<i;p++)s+=a[p]*W[p*o+q];z[q]=s}
    if(k<net.W.length-1){for(let q=0;q<o;q++)if(z[q]<0)z[q]=0}else{let mx=-Infinity;for(const v of z)mx=Math.max(mx,v);let sm=0;for(let q=0;q<o;q++){z[q]=Math.exp(z[q]-mx);sm+=z[q]}for(let q=0;q<o;q++)z[q]/=sm}
    acts.push(z)}return acts}
const xent=(net,X,y)=>X.reduce((a,x,i)=>a-Math.log(fwd(net,x).at(-1)[y[i]]+1e-12),0)/X.length;
const predict=(net,x)=>{const p=fwd(net,x).at(-1);let k=0;for(let q=1;q<p.length;q++)if(p[q]>p[k])k=q;return k};
function fitNet(net,X,y,Xt,yt,r,{epochs=150,batch=32,lr=0.05,mom=0.9,l2=1e-4}={}){const n=X.length,L=net.W.length,nb=Math.max(1,Math.floor(n/batch)),hist={tr:[],te:[]};
  for(let ep=0;ep<epochs;ep++){const perm=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
    let st=0;for(let c=0;c<nb;c++){const size=Math.floor(n/nb)+(c<n%nb?1:0),idx=perm.slice(st,st+size);st+=size;
      const gW=net.W.map(w=>new Float64Array(w.length)),gb=net.b.map(v=>new Float64Array(v.length));
      for(const s of idx){const acts=fwd(net,X[s]);let delta=Float64Array.from(acts[L],(v,q)=>(v-(q===y[s]?1:0))/idx.length);
        for(let k=L-1;k>=0;k--){const i=net.sz[k],o=net.sz[k+1],a=acts[k],W=net.W[k];
          for(let p=0;p<i;p++)for(let q=0;q<o;q++)gW[k][p*o+q]+=a[p]*delta[q];for(let q=0;q<o;q++)gb[k][q]+=delta[q];
          if(k){const nd=new Float64Array(i);for(let p=0;p<i;p++){if(a[p]<=0)continue;let s2=0;for(let q=0;q<o;q++)s2+=delta[q]*W[p*o+q];nd[p]=s2}delta=nd}}}
      for(let k=0;k<L;k++){const W=net.W[k],vW=net.vW[k];for(let j=0;j<W.length;j++){vW[j]=mom*vW[j]-lr*(gW[k][j]+l2*W[j]);W[j]+=vW[j]}
        for(let q=0;q<net.b[k].length;q++){net.vb[k][q]=mom*net.vb[k][q]-lr*gb[k][q];net.b[k][q]+=net.vb[k][q]}}}

  return hist}
function runClassifier(o){const r=rngf(1000+o.seed),X=[],y=[];
  CLS.forEach((key,lab)=>izhTrains(key,o.n,o.jit,o.noise,r).forEach(sp=>{X.push(trainFeatures(sp));y.push(lab)}));
  const tr=[],te=[];for(let k=0;k<CLS.length;k++){const idx=y.map((v,i)=>v===k?i:-1).filter(i=>i>=0);for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
    const nt=Math.round(0.3*idx.length);te.push(...idx.slice(0,nt));tr.push(...idx.slice(nt))}
  const cols=o.feat===2?[3,1]:[0,1,2,3,4],sel=x=>cols.map(c=>x[c]);
  const Xtr0=tr.map(i=>sel(X[i])),mu=cols.map((_,j)=>Xtr0.reduce((a,x)=>a+x[j],0)/Xtr0.length),sd=cols.map((_,j)=>Math.sqrt(Xtr0.reduce((a,x)=>a+(x[j]-mu[j])**2,0)/Xtr0.length)+1e-9);
  const z=x=>Float64Array.from(sel(x),(v,j)=>(v-mu[j])/sd[j]),Xtr=tr.map(i=>z(X[i])),Xte=te.map(i=>z(X[i])),ytr=tr.map(i=>y[i]),yte=te.map(i=>y[i]);
  const res={X,y,o};
  for(const [name,hid] of [["mlp",[16,16]],["lr",[]]]){const net=makeNet(cols.length,5,hid,r),h=fitNet(net,Xtr,ytr,Xte,yte,r);
    const cm=CLS.map(()=>new Array(5).fill(0));Xte.forEach((x,i)=>cm[yte[i]][predict(net,x)]++);
    res[name]={hist:h,cm,acc:cm.reduce((a,row,i)=>a+row[i],0)/yte.length,nparams:net.nparams}}
  return res}
/* Integration: rgba() computed from --accent instead of color-mix(), so the shading also works in browsers without color-mix() */
function rgbOf(c){c=c.trim();if(c[0]==="#"){if(c.length===4)c="#"+[...c.slice(1)].map(x=>x+x).join("");const n=parseInt(c.slice(1,7),16);return[n>>16&255,n>>8&255,n&255]}
  const m=c.match(/\d+(\.\d+)?/g);return m?m.slice(0,3).map(Number):[51,34,136]}
function cmTable(cm,cap){const [ar,ag,ab]=rgbOf(css("--accent"));const rows=cm.map((row,i)=>{const tot=row.reduce((a,b)=>a+b,0)||1;
    return `<tr><th scope="row">${CLS[i]}</th>`+row.map(v=>{const pc=Math.round(100*v/tot);return `<td style="background:rgba(${ar},${ag},${ab},${(pc/100).toFixed(2)});color:${pc>55?"var(--panel)":"var(--fg)"}">${v}</td>`}).join("")+"</tr>"}).join("");

  let h=`<h1>${esc(T("ux_ws_t"))}</h1><p>${esc(T("ux_ws_name"))}: ______________________________ &nbsp; ${esc(T("ux_ws_date"))}: ____________</p><p>${esc(T("ux_ws_intro"))}</p>`;
  UXK.forEach((k,m)=>{const g=UXG[k];h+=`<h2>${m+1}. ${esc(T(MODS[m][1]))}</h2>`;key+=`<h2>${m+1}. ${esc(T(MODS[m][1]))}</h2>`;
    g.ret.forEach(([r])=>{n++;h+=`<div class="wsq"><p><b>${n}.</b> ${esc(T(r+"_q"))}</p>${L("ux_pred")}${L("ux_obsv")}${L("ux_expl")}</div>`;key+=`<p><b>${n}.</b> ${esc(T(r+"_a"))}</p>`});
    (g.cases||[]).forEach(([c])=>{n++;h+=`<div class="wsq"><p><b>${n}. ${esc(T("ux_ws_case"))}: ${esc(T(c+"_t"))}.</b> <i>${esc(T(c+"_v"))}</i></p><p>${esc(T(c+"_q"))}</p>${L("ux_obsv")}${L("ux_expl")}${L("ux_lim")}</div>`;
      key+=`<p><b>${n}.</b> ${esc(T(c+"_i"))} <i>${esc(T("ux_lim"))}: ${esc(T(c+"_l"))}</i></p>`})});
  $("ws").innerHTML=h+`<section class="key"><h1>${esc(T("ux_ws_key"))}</h1>${key}</section>`}

/* UX: theme — explicit light/dark override stored in localStorage "nse-theme" (GRAF's MutationObserver redraws) */
const uxDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function uxTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}

/* UX: everything that depends on language (called from texts()) */
function uxTexts(){
  UXK.forEach(k=>$("gb-"+k).innerHTML=uxGuideHTML(k));
  $("gl-dl").innerHTML=T("gloss").map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join("");
  $("ux-ws-btn").title=T("ux_print_t");$("ux-theme-btn").title=T("ux_theme_t");
  document.querySelectorAll("[data-reset]").forEach(b=>b.title=T("ux_reset_t"))}

function uxInit(){
  // first visit
  let seen=false;try{seen=localStorage.getItem("nse-onb")==="1"}catch(e){}
  $("ux-onb").hidden=seen;
  $("ux-onb-ok").onclick=()=>{$("ux-onb").hidden=true;try{localStorage.setItem("nse-onb","1")}catch(e){};$("tab-"+cur).focus()};
  // glossary
  const gl=$("gl"),openGl=()=>{if(gl.showModal)gl.showModal();else gl.setAttribute("open","")};
  $("ux-gl-btn").onclick=openGl;$("ux-onb-gl").onclick=openGl;
  $("gl-close").onclick=()=>{if(gl.close)gl.close();else gl.removeAttribute("open")};
  gl.addEventListener("click",e=>{if(e.target===gl&&gl.close)gl.close()});   // click on backdrop closes
  // challenges, cases, resets (event delegation survives texts() rebuilds)
  document.addEventListener("click",e=>{const b=e.target.closest("[data-set],[data-reset]");if(!b)return;
    if(b.dataset.reset!==undefined)return uxReset(+b.dataset.reset);
    const [k,kind,i]=b.dataset.set.split(":");uxSet(k,UXG[k][kind][+i][1])});
  // keyboard: arrow keys / Home / End move between tabs (WAI-ARIA tabs pattern)
  $("tabs").addEventListener("keydown",e=>{const n=MODS.length;let k=null;
    if(e.key==="ArrowRight")k=(cur+1)%n;else if(e.key==="ArrowLeft")k=(cur+n-1)%n;else if(e.key==="Home")k=0;else if(e.key==="End")k=n-1;
    if(k===null)return;e.preventDefault();show(k);$("tab-"+k).focus()});
  // theme
  try{const t=localStorage.getItem("nse-theme");if(t==="light"||t==="dark")uxTheme(t)}catch(e){}
  $("ux-theme-btn").onclick=()=>{const t=uxDark()?"light":"dark";uxTheme(t);try{localStorage.setItem("nse-theme",t)}catch(e){}};
  // print: worksheet button, and always print canvases in light colours
  let prevTheme=null;
  window.addEventListener("beforeprint",()=>{prevTheme=document.documentElement.dataset.theme||null;if(uxDark()){uxTheme("light");grafRedraw()}else prevTheme=undefined});
  window.addEventListener("afterprint",()=>{document.body.classList.remove("ws-print");if(prevTheme!==undefined){uxTheme(prevTheme);grafRedraw()}});
  $("ux-ws-btn").onclick=()=>{uxWorksheet();document.body.classList.add("ws-print");window.print()};
  uxHeights()}
// ---------------------------------------------------------------- UX: end


// ---------------------------------------------------------------- wiring
const $=id=>document.getElementById(id);
const out=(id,v)=>{$(id+"-o").textContent=v};
const MODS=[["m-hh","tab_hh",updHH],["m-lif","tab_lif",updLIF],["m-izh","tab_izh",updIZH],["m-net","tab_net",()=>{lastNet?netShow(lastNet):runNet()}],
  ["m-pro","tab_pro",()=>updPro()],["m-cls","tab_cls",()=>{clsLabels();lastCls?showCls(lastCls):runCls()}]];
let cur=0;
function show(i){cur=i;MODS.forEach(([id],k)=>{$(id).hidden=k!==i;$("tab-"+k).setAttribute("aria-selected",k===i);$("tab-"+k).tabIndex=k===i?0:-1});
  if(location.hash!=="#"+MODS[i][0].slice(2))history.replaceState(null,"","#"+MODS[i][0].slice(2));MODS[i][2]()}
function texts(){document.documentElement.lang=lang;document.title=T("doc_title");document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  $("tabs").innerHTML=MODS.map(([,k],i)=>`<button role="tab" id="tab-${i}" aria-selected="${i===cur}" aria-controls="${MODS[i][0]}" tabindex="${i===cur?0:-1}"><span class="n">${i+1}</span>${T(k)}</button>`).join("");
  MODS.forEach((_,i)=>$("tab-"+i).onclick=()=>show(i));
  $("hh-presets").innerHTML=HHP.map(([k],i)=>`<button data-p="${i}">${T(k)}</button>`).join("");
  $("hh-presets").querySelectorAll("button").forEach(b=>b.onclick=()=>{const p=HHP[+b.dataset.p][1];$("hh-na").value=p.na;$("hh-k").value=p.k;$("hh-ko").value=p.ko;$("hh-I").value=p.I;$("hh-T").value=p.T??6.3;$("hh-ca").value=p.ca??1;updHH()});
  $("net-presets").innerHTML=NETP.map(([k],i)=>`<button data-p="${i}">${T(k)}</button>`).join("");
  $("net-presets").querySelectorAll("button").forEach(b=>b.onclick=()=>{const p=NETP[+b.dataset.p][1];$("net-g").value=p.g;$("net-ext").value=p.e;$("net-ni").value=p.ni;$("net-th").value=p.th??-50;netLabels();runNet()});
  $("izh-cls").innerHTML=Object.keys(IZH).map(k=>`<option value="${k}">${k} · ${T("cl_"+k)}</option>`).join("")+`<option value="custom" disabled>${T("ux_custom")}</option>`;
  [...$("lif-dt").options].forEach(o=>o.textContent=nf(+o.value,o.value.length>2?o.value.length-2:0));
  
  uxTexts();grafTexts()}
function netLabels(){out("net-g",nf(+$("net-g").value,1));out("net-ext",nf(+$("net-ext").value,1));out("net-ni",$("net-ni").value);out("net-th",nf(+$("net-th").value,1))}
["hh-I","hh-dur","hh-na","hh-k","hh-ko","hh-T","hh-ca"].forEach(id=>$(id).addEventListener("input",updHH));
["lif-I","lif-dt"].forEach(id=>$(id).addEventListener("input",updLIF));
["izh-a","izh-b","izh-c","izh-d","izh-I"].forEach(id=>$(id).addEventListener("input",updIZH));
["net-g","net-ext","net-ni","net-th"].forEach(id=>$(id).addEventListener("input",()=>{netLabels();uxStale()}));
$("net-run").onclick=runNet;
$("pro-sel").addEventListener("change",()=>updPro());["pro-vc","pro-int","pro-amp"].forEach(id=>$(id).addEventListener("input",()=>updPro()));$("pro-run").onclick=()=>updPro(true);
["cls-n","cls-noise","cls-jit","cls-seed","cls-feat"].forEach(id=>$(id).addEventListener("input",()=>{clsLabels();uxStaleCls()}));$("cls-run").onclick=runCls;

grafEnhance(); /* GRAF: toolbars, overlay canvases, readouts (before texts() so their labels get translated) */
texts();
grafWireGhost();
$("izh-cls").addEventListener("change",()=>{const [a,b,c,d]=IZH[$("izh-cls").value];$("izh-a").value=a;$("izh-b").value=b;$("izh-c").value=c;$("izh-d").value=d;updIZH()});
netLabels();clsLabels();
uxInit(); /* UX: must run before show() */
const start=MODS.findIndex(([id])=>"#"+id.slice(2)===location.hash);show(start<0?0:start);
window.addEventListener("hashchange",()=>{const k=MODS.findIndex(([id])=>"#"+id.slice(2)===location.hash);if(k>=0&&k!==cur)show(k)});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{uxHeights();grafRedraw()},150)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",grafRedraw);
/* GRAF: redraw when data-theme changes, when the device pixel ratio changes, and once web fonts load */
new MutationObserver(grafRedraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
(function dprWatch(){const m=matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);m.addEventListener("change",()=>{grafRedraw();dprWatch()},{once:true})})();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(grafRedraw);
</script>
</body>
</html>
